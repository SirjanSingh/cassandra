[project]
name = "cassandra-ai"
version = "0.4.0"
description = "Checks your AI bot's answers against the data it was given, and flags what the data doesn't back"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["llm", "chatbot", "agents", "rag", "hallucination", "faithfulness", "evaluation", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core = the offline checks (tool-call rule, numbers & times) and the CLI. No network.
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
llm = ["openai>=1.50.0"]                                  # the claim-by-claim check
serve = ["fastapi>=0.115.0", "uvicorn>=0.32.0"]           # `cassandra serve` HTTP API
full = ["cassandra-ai[llm,serve]"]
dev = [
    "cassandra-ai[full]",
    "httpx>=0.27.0",                                      # FastAPI TestClient
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.urls]
Homepage = "https://github.com/SirjanSingh/cassandra"
Repository = "https://github.com/SirjanSingh/cassandra"

[project.scripts]
cassandra = "cassandra.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cassandra"]

[tool.hatch.build.targets.sdist]
include = ["/cassandra", "/README.md", "/LICENSE", "/pyproject.toml", "/.env.example"]
